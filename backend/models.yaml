# Model registry.
#
# Adding a newly released open-weight model means adding a block here -- no
# code changes -- which is what the problem statement asks for ("new open
# weight models should be addable later without redesigning the system").
#
# If a listed model is not present in the local runtime, router._resolve()
# substitutes the closest model that is loaded. That is what allows the same
# deployment to run on a 16 GB workstation and on a larger GPU server.

default: qwen2.5:7b-instruct

models:
  - id: qwen2.5:7b-instruct
    tasks: [summarize, draft_document, analyze, plan, general]
    reason: "general reasoning and document drafting"

  - id: qwen2.5-coder:7b
    tasks: [write_code, debug, explain_code]
    reason: "code-specialised model"

  - id: qwen2.5vl:3b
    tasks: [image_understanding, ocr_handwriting, drawing_review]
    reason: "vision-language model for scans, drawings and handwriting"

  # Larger tier -- used automatically when present on a bigger GPU server.
  - id: qwen2.5:14b-instruct
    tasks: [long_document, board_note]
    reason: "higher-quality drafting when VRAM allows"
